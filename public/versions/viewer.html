<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Code — ดูเวอร์ชันย้อนหลัง</title><link rel="stylesheet" href="versions.css"></head>
<body><header class="viewer-header"><a class="back" href="index.html">← ทุกเวอร์ชัน</a><h1 id="title" class="viewer-title">Life Code</h1><div class="viewer-controls"><button id="desktop" type="button">คอม</button><button id="mobile" type="button">มือถือ</button><button id="zoom" type="button" aria-pressed="false">ขนาดจริง</button><a id="open" href="index.html" target="_blank" rel="noopener">เปิดเว็บ ↗</a></div></header>
<p id="note" class="viewer-note"></p><main id="frame" class="viewer-frame"><img id="capture" alt="ภาพเต็มหน้าของเวอร์ชันที่เลือก"></main>
<script>
const versions={original:{name:'Original — เวอร์ชันแรก',url:'http://127.0.0.1:5186/',note:'ภาพที่บันทึกไว้ของเวอร์ชันแรก · กดเปิดเว็บเพื่อทดลองใช้งาน'},amber:{name:'The Amber Atelier — เวอร์ชัน 2',url:'https://www.figma.com/design/LqRPvQwLT21JOqbGjazCyh?node-id=18-16',note:'ภาพเก็บย้อนหลังของ Amber · ภาพนี้ไม่เคลื่อนไหวและฟอร์มในภาพกรอกไม่ได้ · เปิดแก้ไขงานออกแบบต่อได้ใน Figma'},fantasy:{name:'The Celestial Sanctuary — เวอร์ชันล่าสุด',url:'http://127.0.0.1:5187/',note:'ภาพที่บันทึกไว้ของเวอร์ชันแฟนตาซี · กดเปิดเว็บเพื่อเล่นกับฉาก 3D'}};
const params=new URLSearchParams(location.search);const key=Object.hasOwn(versions,params.get('version'))?params.get('version'):'amber';const version=versions[key];let device=params.get('device')==='mobile'?'mobile':'desktop';const frame=document.getElementById('frame');const capture=document.getElementById('capture');const open=document.getElementById('open');
document.title=version.name+' — Life Code';document.getElementById('title').textContent=version.name;document.getElementById('note').textContent=version.note;open.textContent=key==='amber'?'เปิด Figma ↗':'เปิดเว็บ ↗';
function show(){frame.dataset.device=device;capture.src='images/'+key+'-'+device+'.png';capture.alt='ภาพเต็มหน้า '+version.name+' — '+(device==='mobile'?'มือถือ':'คอม');document.getElementById('desktop').setAttribute('aria-pressed',String(device==='desktop'));document.getElementById('mobile').setAttribute('aria-pressed',String(device==='mobile'));open.href=key==='amber'?'https://www.figma.com/design/LqRPvQwLT21JOqbGjazCyh?node-id='+(device==='mobile'?'18-177':'18-16'):version.url;history.replaceState(null,'','viewer.html?version='+key+'&device='+device)}
document.getElementById('desktop').onclick=()=>{device='desktop';show()};document.getElementById('mobile').onclick=()=>{device='mobile';show()};document.getElementById('zoom').onclick=event=>{const actual=frame.classList.toggle('actual');event.currentTarget.setAttribute('aria-pressed',String(actual));event.currentTarget.textContent=actual?'พอดีหน้าจอ':'ขนาดจริง'};show();
</script></body></html>
