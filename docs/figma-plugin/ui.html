<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; font: 13px/1.55 system-ui, sans-serif; color: #272920; background: #faf8f2; }
  h1 { font: 600 19px/1.3 system-ui, sans-serif; margin: 0 0 12px; }
  p { margin: 0 0 16px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { display: block; width: 100%; margin-top: 8px; }
  button { border: 1px solid #272920; border-radius: 24px; padding: 11px 16px; cursor: pointer; margin: 20px 5px 0 0; font: inherit; background: #272920; color: #faf8f2; }
  button.secondary { color: #272920; background: transparent; }
  button:disabled { opacity: .55; cursor: wait; }
  #status { margin-top: 16px; overflow-wrap: anywhere; }
</style>
<h1>Finish The Amber Atelier</h1>
<p>Repairs the existing editable Figma draft. Use PNG crops of the real Three.js scene from the finished local app. Text and controls remain native Figma layers.</p>
<label for="desktop">Desktop scene PNG · 636 × 600 slot</label>
<input id="desktop" type="file" accept="image/png">
<label for="mobile">Mobile scene PNG · 342 × 360 slot</label>
<input id="mobile" type="file" accept="image/png">
<button id="finish">Repair + insert captures</button>
<button id="repair" class="secondary">Repair CTA only</button>
<p id="status" role="status">No network requests. No purchases or plan changes.</p>
<script>
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('button')];
  function busy(value) { buttons.forEach(button => button.disabled = value); }
  async function send(type) {
    try {
      const message = { type };
      if (type === 'finish') {
        for (const key of ['desktop', 'mobile']) {
          const file = document.getElementById(key).files[0];
          if (!file || file.type !== 'image/png') throw new Error(`Choose a ${key} PNG scene capture.`);
          message[key] = new Uint8Array(await file.arrayBuffer());
        }
      }
      busy(true);
      status.textContent = 'Applying the recorded draft repair…';
      parent.postMessage({ pluginMessage: message }, '*');
    } catch (error) { status.textContent = error.message; busy(false); }
  }
  document.getElementById('repair').onclick = () => send('repair');
  document.getElementById('finish').onclick = () => send('finish');
  onmessage = event => {
    const message = event.data.pluginMessage;
    if (!message || !['success', 'error'].includes(message.type)) return;
    status.textContent = message.text;
    busy(false);
  };
</script>
</html>
